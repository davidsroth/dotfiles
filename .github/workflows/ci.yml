name: pi-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pi-check:
    name: Typecheck and test pi extensions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            pi/.pi/agent/extensions/package-lock.json
            pi/packages/*/package-lock.json

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install pi coding agent globally
        run: npm install -g @earendil-works/pi-coding-agent@0.80.6

      - name: Install locked Pi development dependencies
        run: bash scripts/pi-packages.sh install-dev

      - name: Verify and typecheck all configured Pi packages
        run: just pi-check

      - name: Test all configured Pi packages
        run: just pi-test

  macos-check:
    name: Validate primary macOS platform
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install lightweight validators
        run: brew install just stow jq lua

      - name: Run script and config tests
        run: just script-test

      - name: Audit tracked configuration
        run: just audit

      - name: Verify generated keyboard layout
        run: |
          python3 macos/keyboard-layouts/gen-us-nooption.py
          git diff --exit-code -- macos/keyboard-layouts/US-NoOption.keylayout

      - name: Parse Brewfile
        run: brew bundle list --file Brewfile >/dev/null

  config-check:
    name: Validate scripts and tracked configs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install lightweight validators
        run: sudo apt-get update && sudo apt-get install -y jq lua5.4 ruby stow zsh

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Run script and config tests
        run: just script-test

      - name: Audit tracked configuration
        run: just audit
