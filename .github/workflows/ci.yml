name: pi-checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pi-check:
    name: Typecheck and test pi extensions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            pi/.pi/agent/extensions/package-lock.json
            pi/packages/*/package-lock.json

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install pi coding agent globally
        run: npm install -g @earendil-works/pi-coding-agent@0.80.6

      - name: Install locked Pi development dependencies
        run: bash scripts/pi-packages.sh install-dev

      - name: Verify and typecheck all configured Pi packages
        run: just pi-check

      - name: Test all configured Pi packages
        run: just pi-test

  macos-check:
    name: Validate primary macOS platform
    runs-on: macos-15

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install lightweight validators
        run: brew install just stow jq lua shellcheck

      - name: Run script and config tests
        run: just script-test

      - name: Audit tracked configuration
        run: just audit

      - name: Verify generated keyboard layout
        run: |
          python3 macos/keyboard-layouts/gen-us-nooption.py
          git diff --exit-code -- macos/keyboard-layouts/US-NoOption.keylayout

      - name: Parse Brewfile
        run: brew bundle list --file Brewfile >/dev/null

  config-check:
    name: Validate scripts and tracked configs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install lightweight validators
        run: sudo apt-get update && sudo apt-get install -y jq lua5.4 ruby shellcheck stow zsh

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run script and config tests
        run: just script-test

      - name: Install pinned Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks

      - name: Scan current tree for secrets
        run: just secret-scan

      - name: Audit tracked configuration
        run: just audit
