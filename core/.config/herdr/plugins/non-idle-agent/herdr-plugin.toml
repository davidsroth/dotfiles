id = "local.non-idle-agent"
name = "Non-idle Agent Switcher"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Prefer done agents before cycling other non-idle agents; return from a sole active agent"
platforms = ["macos", "linux"]

[[actions]]
id = "swap"
title = "Prefer done, then switch non-idle agent"
contexts = ["global", "workspace"]
command = ["python3", "switch.py"]
